name: Backend
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netbridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d netbridge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/netbridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - run: npm run web:test
      - run: npm run gateway:test
      - run: npm run db:validate
      - run: npm test
      - run: npm run verify:deployment
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NETBRIDGE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/netbridge
      - run: npm test
        env:
          NETBRIDGE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/netbridge
      - run: docker compose config --quiet
      - run: docker build --target migrate -t netbridge-migrate .
      - run: docker build --target runtime -t netbridge-api .
      - run: docker build --target web -t netbridge-web .
      - name: Verify container migration and startup
        run: |
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" netbridge-migrate
          docker run -d --name netbridge-ci-api --network host -e DATABASE_URL="$DATABASE_URL" netbridge-api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/v1/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs netbridge-ci-api
          exit 1
      - name: Verify web container and API proxy
        run: |
          docker run -d --name netbridge-ci-web --network host -e API_URL=http://127.0.0.1:3000 netbridge-web
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              curl --fail --silent http://127.0.0.1:5173/v1/health/ready
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5173/v1/dashboard)
              test "$status" = 401
              exit $?
            fi
            sleep 2
          done
          docker logs netbridge-ci-web
          exit 1
      - name: Verify database outage and recovery
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker stop "$POSTGRES_CONTAINER"
          curl --fail --silent --max-time 15 http://127.0.0.1:3000/v1/health
          status=$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/v1/health/ready)
          test "$status" = 503
          docker start "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 15 http://127.0.0.1:3000/v1/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs netbridge-ci-api
          exit 1
      - name: Verify graceful container shutdown
        run: |
          docker stop --time 10 netbridge-ci-api
          status=$(docker inspect --format '{{.State.ExitCode}}' netbridge-ci-api)
          case "$status" in
            0|143) echo "API stopped on SIGTERM" ;;
            *) docker logs netbridge-ci-api; exit 1 ;;
          esac
      - name: Clean up container
        if: always()
        run: docker rm -f netbridge-ci-api netbridge-ci-web 2>/dev/null || true
